    <path d="M3 9h18" stroke="currentColor" stroke-width="2" pathLength="1"/>
    <circle cx="7" cy="6" r="1" fill="currentColor" pathLength="1"/>
    <circle cx="10" cy="6" r="1" fill="currentColor" pathLength="1"/>
