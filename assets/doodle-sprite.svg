<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!-- Doodle sprite for jayptl.me redesign (Gate P). Hand-authored, sketchy,
       single-stroke symbols. Canonical source: assets/doodle-sprite.svg.
       Inlined once per page as <svg id="doodleSprite"> (never fetched).
       Consumers: <svg class="doodle"><use href="#d-arrow"/></svg>.
       Animated copies are pasted INLINE with class="doodle-draw" (<use>
       shadow-DOM cannot be dash-animated). Stroke uses currentColor so
       themes recolor it; fill none unless noted. Every stroked shape carries
       pathLength="1" so draw-on is pure CSS (dasharray:1 -> offset:0). -->
  <defs>
    <!-- Hand-drawn arrow, points right -->
    <symbol id="d-arrow" viewBox="0 0 64 24">
      <title>Hand-drawn arrow</title>
      <path d="M3 13 C 18 13 30 12 44 8 M40 5 c 4 3 8 5 14 4 M40 11 c 5 1 9 2 14 4"
            fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
    </symbol>

    <!-- Hand-drawn curved underline (squiggle under a word) -->
    <symbol id="d-underline" viewBox="0 0 120 14">
      <title>Hand-drawn underline</title>
      <path d="M4 9 C 20 4 34 6 48 9 C 62 12 74 6 88 8 C 100 10 110 8 116 7"
            fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" pathLength="1"/>
    </symbol>

    <!-- Slightly lopsided circle for circling things -->
    <symbol id="d-circle" viewBox="0 0 64 48">
      <title>Hand-drawn circle</title>
      <path d="M40 5 C 54 8 60 18 58 28 C 56 38 45 44 32 43 C 19 42 8 35 8 24 C 8 14 20 7 32 6 C 40 5 46 7 50 10"
            fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" pathLength="1"/>
    </symbol>

    <!-- Left + right corner bracket -->
    <symbol id="d-bracket-l" viewBox="0 0 24 48">
      <title>Hand-drawn left bracket</title>
      <path d="M18 3 C 8 4 4 10 4 16 L4 32 C 4 38 8 44 18 45"
            fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" pathLength="1"/>
    </symbol>
    <symbol id="d-bracket-r" viewBox="0 0 24 48">
      <title>Hand-drawn right bracket</title>
      <path d="M6 3 C 16 4 20 10 20 16 L20 32 C 20 38 16 44 6 45"
            fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" pathLength="1"/>
    </symbol>

    <!-- Star burst (sparkle) -->
    <symbol id="d-sparkle" viewBox="0 0 32 32">
      <title>Hand-drawn sparkle</title>
      <path d="M16 3 L18 13 L28 11 L21 17 L27 25 L17 21 L13 30 L11 19 L3 20 L10 14 L5 6 L15 10 Z"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" pathLength="1"/>
    </symbol>

    <!-- Washi-tape strip (semi-transparent, used on cards) -->
    <symbol id="d-tape" viewBox="0 0 96 24">
      <title>Hand-drawn washi tape</title>
      <path d="M8 22 L88 22 C 90 16 90 8 88 2 L8 2 C 6 8 6 16 8 22 Z M12 4 L84 4 M12 20 L84 20"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.7" pathLength="1"/>
    </symbol>

    <!-- Scissors / cut-line (between cards) -->
    <symbol id="d-scissors" viewBox="0 0 96 24">
      <title>Hand-drawn scissors cut line</title>
      <circle cx="18" cy="8" r="4.5" fill="none" stroke="currentColor" stroke-width="2" pathLength="1"/>
      <circle cx="18" cy="17" r="4.5" fill="none" stroke="currentColor" stroke-width="2" pathLength="1"/>
      <path d="M22 12 L44 12 M46 6 L44 12 L46 18 M46 6 c 10 0 20 0 30 6 M46 18 c 10 0 20 0 30 -6"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" pathLength="1"/>
    </symbol>

    <!-- Little hand-drawn asterisk / margin note marker -->
    <symbol id="d-asterisk" viewBox="0 0 24 24">
      <title>Hand-drawn asterisk</title>
      <path d="M12 3 L12 21 M4 7 L20 17 M20 7 L4 17"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" pathLength="1"/>
    </symbol>

    <!-- Ink marks (2026-09-28). Same shapes as the path table in
         js/components/ink-mark.js, which draws the animated copies. -->
    <symbol id="d-squiggle" viewBox="0 0 120 12"><title>Hand-drawn squiggle</title><path d="M3 7 C9 2 13 2 17 6 S25 11 30 6 S38 1 43 6 S51 11 56 6 S64 2 69 6 S77 10 82 6 S90 2 95 6 S103 10 108 6 S114 3 117 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></symbol>
    <symbol id="d-marker" viewBox="0 0 120 24"><title>Hand-drawn marker swipe</title><path d="M6 15 C30 12 62 14 88 11 C100 10 108 10 114 10" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></symbol>
    <symbol id="d-scribble-out" viewBox="0 0 120 24"><title>Hand-drawn scribble out</title><path d="M3 13 C12 6 18 18 26 11 C34 4 40 18 49 11 C58 4 64 18 73 11 C82 4 88 18 97 11 C104 6 110 14 117 10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></symbol>
    <symbol id="d-loop-arrow" viewBox="0 0 72 40"><title>Hand-drawn loop arrow</title><path d="M4 30 C14 30 22 26 26 18 C30 10 24 4 19 8 C14 12 20 22 32 24 C44 26 54 22 64 17 M56 12 L64 17 L57 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></symbol>
    <symbol id="d-heart" viewBox="0 0 24 22"><title>Hand-drawn heart</title><path d="M12 20 C6 15 2 11 2.8 7 C3.6 3.4 8 2.4 10.4 5.2 C11.2 6.1 11.7 7 12 7.8 C12.6 6 14 3.8 16.6 3.4 C20 3 22 6 21.2 9 C20.2 13 16 16.4 12.4 20.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></symbol>
    <symbol id="d-check" viewBox="0 0 24 24"><title>Hand-drawn check</title><path d="M4 13 C6 14.5 8 16.5 9.5 19 C12 13 15.5 8 20.5 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></symbol>
    <symbol id="d-box" viewBox="0 0 100 40"><title>Hand-drawn box</title><path d="M5 6 C35 4 68 5 95 5 C96 15 96 26 95 35 C66 36 34 36 6 35 C4 25 4 14 6 4 L12 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></symbol>
    <symbol id="d-brace" viewBox="0 0 20 100"><title>Hand-drawn curly brace</title><path d="M16 3 C9 4 8 8 8 16 L8 40 C8 46 6 49 2 50 C6 51 8 54 8 60 L8 84 C8 92 9 96 16 97" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></symbol>
    <symbol id="d-burst" viewBox="0 0 64 64"><title>Hand-drawn starburst</title><path d="M32 1.5 L37.6 11.1 L46.7 6.6 L46.7 17.3 L58.3 16.8 L52.8 26.4 L61.2 32 L53.9 37.9 L58.6 47.4 L47 47 L46.9 57.9 L37.8 53.6 L32 63 L26.8 51.5 L16.8 58.4 L17.4 46.6 L5.1 47.5 L12.2 37.3 L1.3 32 L11.3 26.4 L6.4 17.2 L17.8 17.8 L16.1 4.4 L26.1 9.9 L32 1.5 L37.6 11.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></symbol>
    <symbol id="d-zigzag" viewBox="0 0 240 12"><title>Hand-drawn zigzag rule</title><path d="M2 7 L10 3 L17 9 L25 3 L33 9 L40 4 L48 9 L56 3 L63 8 L71 3 L79 9 L86 4 L94 9 L102 3 L109 8 L117 3 L125 9 L132 4 L140 9 L148 3 L155 8 L163 3 L171 9 L178 4 L186 9 L194 3 L201 8 L209 3 L217 9 L224 4 L232 8 L238 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></symbol>
    <symbol id="d-here" viewBox="0 0 80 48"><title>Hand-drawn you-are-here loop</title><path d="M52 8 C40 3 18 5 10 14 C3 22 8 34 24 38 C42 42 64 38 70 28 C75 19 66 10 52 8 C44 7 36 9 32 12 M70 31 C73 36 75 40 77 45" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></symbol>
    <symbol id="d-margin" viewBox="0 0 64 40"><title>Hand-drawn margin note arrow</title><path d="M4 6 C16 4 30 8 38 18 C44 25 48 30 57 32 M49 27 L57 32 L50 37" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></symbol>
  </defs>
</svg>
