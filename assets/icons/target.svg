<svg data-normalized="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="icon"><title>Target icon</title>
  <defs>
    <linearGradient id="i-target-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="gradient-start" style="stop-color:var(--icon-gradient-start, #2196f3);stop-opacity:1" />
      <stop offset="100%" class="gradient-end" style="stop-color:var(--icon-gradient-end, #00b8cc);stop-opacity:1" />
    </linearGradient>
  </defs>
  <g class="icon-gradient">
    <circle cx="12" cy="12" r="10" fill="url(#i-target-grad)" opacity="0.1" pathLength="1"/>
    <circle cx="12" cy="12" r="10" stroke="url(#i-target-grad)" stroke-width="2" fill="none" pathLength="1"/>
    <circle cx="12" cy="12" r="6" stroke="url(#i-target-grad)" stroke-width="2" fill="none" pathLength="1"/>
    <circle cx="12" cy="12" r="2" fill="url(#i-target-grad)" pathLength="1"/>
  </g>
  <g class="icon-mono" style="display:none;">
    <circle cx="12" cy="12" r="10" fill="currentColor" opacity="0.1" pathLength="1"/>
    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" pathLength="1"/>
    <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="2" fill="none" pathLength="1"/>
    <circle cx="12" cy="12" r="2" fill="currentColor" pathLength="1"/>
  </g>
</svg>
